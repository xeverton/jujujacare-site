name: Atualizar vídeos do canal
on:
  schedule:
    - cron: '17 */3 * * *'   # a cada 3 horas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_videos.py
      - run: |
          git config user.name "jujujacare-bot"
          git config user.email "actions@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Atualiza lista de vídeos" && git push)
