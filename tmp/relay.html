<!doctype html><meta charset="utf-8"><title>relay</title><meta name="robots" content="noindex">
<body style="font-family:sans-serif">enviando arquivo...
<script>
(async () => {
  const u = new URLSearchParams(location.search).get('u');
  const n = new URLSearchParams(location.search).get('n') || 'video.mp4';
  try {
    const r = await fetch(u); const b = await r.blob();
    const T = window.opener || (window.parent !== window ? window.parent : null);
    if (T) { T.postMessage({jjRelay: true, name: n, blob: b}, '*'); document.body.textContent = 'ok ' + b.size; }
    else document.body.textContent = 'sem opener';
  } catch (e) { document.body.textContent = 'erro ' + e; if (window.opener || window.parent !== window) (window.opener || window.parent).postMessage({jjRelay: true, error: String(e)}, '*'); }
  if (window.opener) setTimeout(() => window.close(), 1500);
})();
</script>
